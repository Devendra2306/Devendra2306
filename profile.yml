# =====================================================================
# profile.yml  —  the ONLY file you ever edit by hand.
# The script reads this + the GitHub API and rebuilds README.md.
#
# Adding a NEW project later (no editing needed at all):
#   1. Write a one-line description on the GitHub repo
#   2. Add the topic  "showcase"  to the repo
#   3. Done. It appears on your profile on the next run (daily, or run manually).
#
# Want a richer card (highlights / live link / metrics)? Add it under
# `projects:` below. Anything you write here overrides what GitHub says.
# =====================================================================

